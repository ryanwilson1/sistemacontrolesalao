# =====================================================================
# System Studio · publicação no Netlify
# =====================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------
# Rotas do aplicativo
# Sem isto, abrir /agenda direto ou recarregar /agendar/emely-barbosa
# devolve 404: o Netlify procuraria um arquivo com esse nome.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------
# Cabeçalhos de segurança
# `connect-src` precisa listar o Supabase explicitamente. Com apenas
# 'self' — como estava — o navegador bloqueia toda chamada ao banco e ao
# Realtime, e o sistema abre bonito sem conseguir carregar nada.
#
# `img-src` precisa do Supabase pelo mesmo motivo, e a falta dele passou
# despercebida por mais tempo: a logo e a capa do salão vivem no Storage,
# e o navegador as recusava em silêncio. O efeito pior não era em
# Ajustes — era no LINK PÚBLICO, onde o cabeçalho do portal mostra a
# marca da cliente. A página abria sem logo e sem capa, e nada no
# console de quem usa explicava o motivo.
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Arquivos com hash no nome nunca mudam de conteúdo: cache longo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
